server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The entire app is one HTML file, plus a config script written at
    # container start. Without this nginx sends no Cache-Control at all, so
    # browsers fall back to heuristic freshness and may reuse a cached copy
    # for hours without asking. That is why a deploy could finish cleanly on
    # the server and still leave people running the previous build until they
    # happened to hard-refresh -- the fix looked like it had not shipped.
    #
    # no-cache does not mean do not store: the copy is kept and revalidated,
    # so an unchanged page still comes back as a 304 and costs nothing.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location = /config.js {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Routing is by URL fragment, which never reaches the server, so this only
    # has to put unknown paths back on the one page that exists.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
