services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: infrawatch
      POSTGRES_USER: infrawatch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-infrawatch_dev}
    volumes:
      - db_data:/var/lib/postgresql/data
    # No host port mapping — only reachable from other containers on this
    # compose network (backend -> db). Keeps Postgres off the host entirely.

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://infrawatch:${POSTGRES_PASSWORD:-infrawatch_dev}@db:5432/infrawatch
      JWT_SECRET: ${JWT_SECRET:-change-me-in-prod}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@infrawatch.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme123}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      FRONTEND_URL: ${FRONTEND_URL:-}
    depends_on:
      - db
    ports:
      - "${BACKEND_PORT:-8000}:8000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      API_BASE: ${API_BASE:-http://localhost:8000}
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8080}:80"

volumes:
  db_data:
